<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2747">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Block Dash</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#eef4f8;color:#102a43;display:flex;justify-content:center;min-height:100vh}
.game{width:min(100%,480px);padding:18px 14px 24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{margin:0;font-size:28px}.sub{color:#60758a;font-size:13px}
.stats{display:flex;gap:8px}.stat{background:white;border-radius:14px;padding:8px 11px;font-weight:700;font-size:13px;box-shadow:0 2px 8px #0000000d}
#board{width:100%;aspect-ratio:1;border-radius:22px;background:#102b4d;padding:14px;display:grid;gap:7px;touch-action:none;user-select:none;box-shadow:0 8px 24px #102b4d22}
.cell{border-radius:7px;background:#244a70;position:relative;display:flex;align-items:center;justify-content:center}
.wall{background:#35c978}.goal{background:#f5bf24}.player{background:#f7fafc;border-radius:50%;width:62%;height:62%;box-shadow:0 3px 8px #0004}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px auto 0;max-width:260px}
button{border:0;border-radius:15px;min-height:50px;font-size:18px;font-weight:800;background:white;color:#102a43;box-shadow:0 3px 10px #00000012}
button:active{transform:scale(.97)}.empty{visibility:hidden}
.actions{display:flex;gap:10px;margin-top:12px}.actions button{flex:1;font-size:14px}
.overlay{position:fixed;inset:0;background:#102b4ddd;display:none;align-items:center;justify-content:center;padding:20px}
.modal{background:white;border-radius:24px;padding:25px;text-align:center;width:min(360px,100%)}.modal h2{margin-top:0}
.primary{background:#20bf63;color:white}.hint{font-size:13px;color:#60758a;text-align:center;margin:12px 0 0}
</style>
</head>
<body>
<main class="game">
<header>
  <div><h1>Block Dash</h1><div class="sub">Think • Move • Win</div></div>
  <div class="stats"><div class="stat">⭐ <span id="stars">0</span></div><div class="stat">Lv <span id="level">1</span></div></div>
</header>
<div id="board" aria-label="Game board"></div>
<div class="controls">
  <button class="empty" aria-hidden="true"></button><button data-dir="up" aria-label="Move up">▲</button><button class="empty" aria-hidden="true"></button>
  <button data-dir="left" aria-label="Move left">◀</button><button data-dir="down" aria-label="Move down">▼</button><button data-dir="right" aria-label="Move right">▶</button>
</div>
<div class="actions"><button id="restart">Restart</button><button id="pause">Pause</button></div>
<p class="hint">Reach the ⭐ while avoiding the green blocks.</p>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Paused</h2>
    <p id="modalText">Take a break.</p>
    <button class="primary" id="modalBtn">Continue</button>
  </div>
</div>

<script>
const levels=[
 {n:6,p:[5,0],g:[0,5],w:[[3,0],[3,1],[3,2],[3,3],[1,3],[2,3],[4,1],[4,2]]},
 {7,p:[6,0],g:[0,6],w:[[2,0],[2,1],[2,2],[4,4],[4,5],[4,6],[1,4],[2,4],[3,4],[5,2],[5,3]]},
 {8,p:[7,0],g:[0,7],w:[[2,0],[2,1],[2,2],[2,4],[3,4],[4,4],[5,4],[5,1],[6,1],[6,2],[6,3],[3,6],[4,6],[5,6]]}
];
let levelIndex=0, player=[...levels[0].p], stars=0, paused=false, moves=0;

const board=document.querySelector('#board'), levelEl=document.querySelector('#level'), starsEl=document.querySelector('#stars');
const overlay=document.querySelector('#overlay'), modalTitle=document.querySelector('#modalTitle'), modalText=document.querySelector('#modalText'), modalBtn=document.querySelector('#modalBtn');

function resetLevel(){const l=levels[levelIndex];player=[...l.p];moves=0;paused=false;overlay.style.display='none';draw();}
function isWall(r,c){return levels[levelIndex].w.some(x=>x[0]===r&&x[1]===c)}
function draw(){
 const l=levels[levelIndex]; levelEl.textContent=l.n?levelIndex+1:1; starsEl.textContent=stars;
 board.style.gridTemplateColumns=`repeat(${l.n},1fr)`;board.innerHTML='';
 for(let r=0;r<l.n;r++)for(let c=0;c<l.n;c++){
   const d=document.createElement('div');d.className='cell';
   if(isWall(r,c))d.classList.add('wall');
   if(r===l.g[0]&&c===l.g[1]){d.classList.add('goal');d.textContent='⭐';}
   if(r===player[0]&&c===player[1]){const p=document.createElement('div');p.className='player';d.appendChild(p);}
   board.appendChild(d);
 }
}
function move(dr,dc){
 if(paused)return;
 const l=levels[levelIndex],nr=player[0]+dr,nc=player[1]+dc;
 if(nr<0||nr>=l.n||nc<0||nc>=l.n||isWall(nr,nc))return;
 player=[nr,nc];moves++;draw();
 if(nr===l.g[0]&&nc===l.g[1])win();
}
function win(){
 stars += moves<=10?3:moves<=18?2:1;
 if(levelIndex<levels.length-1){
   modalTitle.textContent='Level Complete!';
   modalText.textContent=`⭐ ${moves<=10?3:moves<=18?2:1} stars • ${moves} moves`;
   modalBtn.textContent='Next Level';overlay.style.display='flex';
   modalBtn.onclick=()=>{levelIndex++;resetLevel()};
 }else{
   modalTitle.textContent='You Win!';
   modalText.textContent=`All levels complete • ${stars} total stars`;
   modalBtn.textContent='Play Again';overlay.style.display='flex';
   modalBtn.onclick=()=>{levelIndex=0;stars=0;resetLevel()};
 }
}
function togglePause(){
 if(overlay.style.display==='flex' && modalTitle.textContent==='Paused'){overlay.style.display='none';paused=false;return}
 paused=true;modalTitle.textContent='Paused';modalText.textContent='Ready when you are.';modalBtn.textContent='Continue';modalBtn.onclick=()=>{paused=false;overlay.style.display='none'};overlay.style.display='flex';
}
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{
 const d=b.dataset.dir;move(d==='up'?-1:d==='down'?1:0,d==='left'?-1:d==='right'?1:0);
}));
document.querySelector('#restart').addEventListener('click',resetLevel);
document.querySelector('#pause').addEventListener('click',togglePause);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowUp')move(-1,0);if(e.key==='ArrowDown')move(1,0);if(e.key==='ArrowLeft')move(0,-1);if(e.key==='ArrowRight')move(0,1);if(e.key==='p')togglePause();
});
let touchStart=null;
board.addEventListener('touchstart',e=>{touchStart=e.changedTouches[0]}, {passive:true});
board.addEventListener('touchend',e=>{
 if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.clientX,dy=t.clientY-touchStart.clientY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 if(Math.abs(dx)>Math.abs(dy))move(0,dx>0?1:-1);else move(dy>0?1:-1,0);touchStart=null;
},{passive:true});
resetLevel();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
